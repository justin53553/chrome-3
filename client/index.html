<!DOCTYPE html>
<html>
<head>
  <title>Bienvenido</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 50px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    h1 { 
      color: #667eea;
      margin-bottom: 20px;
    }
    p { 
      color: #666;
      font-size: 18px;
    }
    .emoji {
      font-size: 60px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">👋</div>
    <h1>¡Bienvenido!</h1>
    <p>Gracias por visitar nuestra página</p>
  </div>
</body>
</html>
